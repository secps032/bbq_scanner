<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SECPS 入場掃描</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#10274a;
  color:white;
  font-family:"Noto Sans TC",sans-serif;
  text-align:center
}
header{padding:18px}
header small{color:#efc875}
h1{font-size:22px;margin:6px 0 0}
main{max-width:480px;margin:auto;padding:0 16px 30px}
#reader{
  width:100%;
  background:#000;
  border-radius:14px;
  overflow:hidden;
  min-height:260px
}
#status{
  min-height:56px;
  margin:14px 0;
  padding:14px;
  border-radius:12px;
  background:#ffffff18;
  line-height:1.7;
  white-space:pre-wrap
}
#status.error{background:#a92d2d}
button,input{
  font:inherit;
  width:100%;
  padding:16px;
  border-radius:12px;
  border:0;
  margin:6px 0
}
button{background:#efc875;color:#10274a;font-weight:800;cursor:pointer}
button.alt{background:white}
button:disabled{opacity:.5}
input{border:1px solid #d9dfe9}
details{margin-top:18px;text-align:left}
summary{cursor:pointer;color:#efc875;padding:8px 0}
</style>
</head>
<body>
<header>
  <small>SECPS ALUMNI · CHRISTMAS 2026</small>
  <h1>入場掃描</h1>
</header>

<main>
  <div id="reader"></div>
  <div id="status">按「啟動相機」，然後對準門票上的 QR Code。</div>

  <button id="startButton" onclick="startCamera()">啟動相機</button>

  <button class="alt" onclick="document.getElementById('photo').click()">
    改用拍照掃描
  </button>

  <input
    id="photo"
    type="file"
    accept="image/*"
    capture="environment"
    hidden
    onchange="scanPhoto(this)">

  <details>
    <summary>人手輸入識別碼</summary>
    <input id="token" autocomplete="off" placeholder="貼上識別碼">
    <button class="alt" onclick="submitToken(document.getElementById('token').value)">
      核對並記錄入場
    </button>
  </details>
</main>

<script>
/*
 * 請填上 Apps Script 網頁應用程式的 /exec 網址
 *（部署 → 管理部署作業 → 網頁應用程式網址）。
 */
const EXEC_URL =
  'https://script.google.com/macros/s/請填上部署ID/exec';

const statusBox = document.getElementById('status');
const startButton = document.getElementById('startButton');

let scanner = null;
let running = false;
let sending = false;

function show(message, isError) {
  statusBox.textContent = message;
  statusBox.className = isError ? 'error' : '';
}

// 門票識別碼由兩個 UUID 組成，只含英數字及「-」。
function validToken(code) {
  return /^[0-9a-f-]{32,200}$/i.test(code);
}

async function stopCamera() {
  if (!scanner) return;

  if (running) {
    try { await scanner.stop(); } catch (error) { console.warn(error); }
  }

  try { scanner.clear(); } catch (error) { console.warn(error); }

  scanner = null;
  running = false;
}

async function submitToken(raw) {
  const code = String(raw || '').trim();

  if (!code) {
    show('請先掃描門票或輸入識別碼。', true);
    return;
  }

  if (!validToken(code)) {
    show('這不是本活動的門票 QR Code。', true);
    return;
  }

  if (sending) return;
  sending = true;

  if (navigator.vibrate) navigator.vibrate(120);

  show('已讀取門票，正在核對…');

  await stopCamera();

  // 以本頁直接開啟 Apps Script，入場結果會在該頁顯示。
  // 結果頁有「掃描下一張」按鈕返回此頁。
  location.href =
    EXEC_URL + '?checkin=' + encodeURIComponent(code);
}

async function startCamera() {
  if (running || sending) return;

  if (typeof Html5Qrcode === 'undefined') {
    show('掃描元件未能載入，請檢查網絡後重新開啟本頁。', true);
    return;
  }

  startButton.disabled = true;
  show('正在啟動相機；如出現提示，請允許使用鏡頭。');

  try {
    await stopCamera();

    scanner = new Html5Qrcode('reader');

    await scanner.start(
      {facingMode: 'environment'},
      {fps: 10, qrbox: 250},
      code => {
        if (!validToken(code)) {
          show('這不是本活動的門票 QR Code，請再掃描。', true);
          return;
        }

        submitToken(code);
      }
    );

    running = true;
    show('✓ 相機已啟動，請對準門票。');

    try {
      localStorage.setItem('SECPS_SCANNER_CAMERA', 'yes');
    } catch (error) { /* 不影響掃描 */ }

  } catch (error) {
    await stopCamera();

    const name = String((error && error.name) || '');
    const text = String((error && error.message) || error);

    if (/NotAllowed|Permission/i.test(name + text)) {
      show(
        '相機權限被拒絕。\n' +
        '請在瀏覽器網址列旁的設定允許「相機」，再按「啟動相機」。\n' +
        '亦可按「改用拍照掃描」。',
        true
      );
    } else if (/NotFound|NotReadable/i.test(name + text)) {
      show(
        '找不到可用的鏡頭，或鏡頭正被其他程式使用。\n' +
        '請關閉其他使用相機的程式後再試。',
        true
      );
    } else {
      show('相機未能啟動：' + text, true);
    }
  } finally {
    startButton.disabled = false;
  }
}

async function scanPhoto(input) {
  const file = input.files[0];
  if (!file) return;

  try {
    await stopCamera();

    scanner = new Html5Qrcode('reader');
    show('正在辨識相片…');

    const code = await scanner.scanFile(file, false);
    await submitToken(code);

  } catch (error) {
    show('相片中找不到 QR Code，請再拍一次，盡量拍清楚整個 QR Code。', true);
  } finally {
    input.value = '';
  }
}

// 已經允許過相機的話，返回本頁時自動啟動。
(function autoStart() {
  let used = false;

  try {
    used = localStorage.getItem('SECPS_SCANNER_CAMERA') === 'yes';
  } catch (error) { /* 忽略 */ }

  if (!used) return;

  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({name: 'camera'})
      .then(result => {
        if (result.state === 'granted') startCamera();
      })
      .catch(() => {});
  }
})();

// 由結果頁按「上一頁」返回時，重設狀態。
window.addEventListener('pageshow', event => {
  if (event.persisted) {
    sending = false;
    running = false;
    scanner = null;
    show('按「啟動相機」，然後對準門票上的 QR Code。');
  }
});
</script>
</body>
</html>
